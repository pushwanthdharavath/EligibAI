version: '3.8'

services:
  # Production-ready Qdrant with persistence
  qdrant:
    image: qdrant/qdrant:v1.7.0
    container_name: eligibai-qdrant-prod
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data_prod:/qdrant/storage
    environment:
      - QDRANT__SERVICE__HTTP_PORT=6333
      - QDRANT__SERVICE__GRPC_PORT=6334
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:6333/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production Redis with persistence
  redis:
    image: redis:7-alpine
    container_name: eligibai-redis-prod
    ports:
      - "6379:6379"
    volumes:
      - redis_data_prod:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Production PostgreSQL with persistence
  postgres:
    image: postgres:15-alpine
    container_name: eligibai-postgres-prod
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eligibai
      - POSTGRES_PASSWORD=${DB_PASSWORD:-eligibai_secure_password}
      - POSTGRES_DB=eligibai
      - POSTGRES_INITDB_ARGS=-E
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eligibai"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backend with production configuration
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eligibai-backend-prod
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://eligibai:${DB_PASSWORD:-eligibai_secure_password}@postgres:5432/eligibai
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION_NAME=scholarships
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - EMBEDDING_MODEL=BAAI/bge-m3
      - RERANKER_MODEL=BAAI/bge-reranker-base
      - PYTHONUNBUFFERED=1
    depends_on:
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
      - backend_logs_prod:/app/logs
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4G
        reservations:
          cpus: '0.5'
          memory: 1G

  # Frontend with production configuration
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eligibai-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - NODE_ENV=production
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.25'
          memory: 512M

  # Nginx reverse proxy for production
  nginx:
    image: nginx:alpine
    container_name: eligibai-nginx-prod
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - frontend
      - backend
    restart: unless-stopped

volumes:
  qdrant_data_prod:
  redis_data_prod:
  postgres_data_prod:
  backend_logs_prod: