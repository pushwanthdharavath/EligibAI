version: '3.8'

services:
  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: eligibai-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: eligibai-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=eligibai
      - POSTGRES_PASSWORD=eligibai_password
      - POSTGRES_DB=eligibai
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  # Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eligibai-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://eligibai:eligibai_password@postgres:5432/eligibai
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
    depends_on:
      - redis
      - postgres
    volumes:
      - ./backend/data:/app/data
      - ./backend/logs:/app/logs
    restart: unless-stopped

  # Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: eligibai-frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  redis_data:
  postgres_data: